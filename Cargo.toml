[package]
name = "redstone"
version = "1.2.0"
edition = "2021"

[dependencies]
local-ip-address = "0.6.5"
rfd = "0.15.4"
tokio = { version = "1.47.1", features = ["net", "fs", "io-util", "macros", "rt-multi-thread"] }
crossterm = "0.29.0"
cursive = { version = "0.21.1", default-features = false, features = ["crossterm-backend"]}

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
